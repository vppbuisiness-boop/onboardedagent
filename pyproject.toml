[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edgeline"
version = "0.1.0"
description = "Esports player-prop pricing engine: line capture, projection model, calibration, EV, slip builder, grading."
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
    "requests>=2.28",
    "typer>=0.9",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
edgeline = "edgeline.cli:app"

[tool.setuptools.packages.find]
include = ["edgeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
